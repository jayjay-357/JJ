name: Acquire Planet Labs identity crosswalk

on:
  push:
    branches: ["work/orion-ahop-earth-orientation"]
    paths:
      - "orion_ahop/ingestion/planet_matching.py"
      - "scripts/acquire_planet_matching.py"
      - ".github/workflows/acquire-planet-matching.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/orion-ahop-earth-orientation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Download and audit Planet identity crosswalk
        run: python scripts/acquire_planet_matching.py --output-dir planet_matching_output
      - uses: actions/upload-artifact@v4
        with:
          name: orion-planet-hwid-crosswalk-review
          path: planet_matching_output/
          if-no-files-found: error
          retention-days: 14
