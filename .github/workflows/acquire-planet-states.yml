name: Acquire Planet Labs Cartesian states

on:
  push:
    branches: ["work/orion-ahop-earth-orientation"]
    paths:
      - "orion_ahop/ingestion/planet_states.py"
      - "scripts/acquire_planet_states.py"
      - ".github/workflows/acquire-planet-states.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/orion-ahop-earth-orientation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Download and validate Planet state vectors
        run: python scripts/acquire_planet_states.py --output-dir planet_states_output
      - uses: actions/upload-artifact@v4
        with:
          name: orion-planet-cartesian-states
          path: planet_states_output/
          if-no-files-found: error
          retention-days: 14
